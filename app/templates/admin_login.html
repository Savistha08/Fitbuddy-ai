<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ title }}</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: #14151b;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #1c1e26;
    border-radius: 14px;
    padding: 30px;
    max-width: 360px;
    width: 100%;
  }
  h1 { font-size: 1.3rem; margin-top: 0; }
  label { display: block; margin: 12px 0 6px; font-size: 0.9rem; color: #cfd3dc; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #3a3f4b;
    background: #14151b;
    color: #f5f5f5;
  }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #ff6a3d;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #ff8459; }
  .error {
    background: #3b1a1a;
    border: 1px solid #ff6b6b;
    color: #ffb4b4;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 {{ title }}</h1>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <label for="token">Admin Token</label>
      <input type="password" id="token" name="token" required autofocus />
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
