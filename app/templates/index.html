<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ title }} - AI Fitness Plan Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(rgba(10, 12, 20, 0.75), rgba(10, 12, 20, 0.75)),
      url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1600&q=60') center/cover no-repeat fixed;
    color: #f5f5f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(20, 22, 30, 0.9);
    border-radius: 16px;
    padding: 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 {
    margin-top: 0;
    font-size: 1.6rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  label {
    display: block;
    margin: 14px 0 6px;
    font-size: 0.9rem;
    color: #cfd3dc;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #3a3f4b;
    background: #1b1d24;
    color: #f5f5f5;
    font-size: 0.95rem;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #ff6a3d;
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #ff6a3d;
    color: white;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #ff8459; }
  .error {
    background: #3b1a1a;
    border: 1px solid #ff6b6b;
    color: #ffb4b4;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 0.9rem;
  }
  .admin-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #9aa0ab;
    font-size: 0.85rem;
    text-decoration: none;
  }
  .admin-link:hover { color: #ff6a3d; }
</style>
</head>
<body>
  <div class="card">
    <h1>🏋️ {{ title }} - AI Workout Generator</h1>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/generate-workout">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required minlength="2" maxlength="120" />

      <label for="user_id">User ID</label>
      <input type="text" id="user_id" name="user_id" required minlength="2" maxlength="64"
             pattern="[A-Za-z0-9_-]+" title="Letters, numbers, - and _ only" />

      <label for="age">Age</label>
      <input type="number" id="age" name="age" required min="13" max="100" />

      <label for="weight_kg">Weight (kg)</label>
      <input type="number" id="weight_kg" name="weight_kg" required min="1" max="500" step="0.1" />

      <label for="goal">Fitness Goal</label>
      <select id="goal" name="goal" required>
        <option value="weight loss">Weight loss</option>
        <option value="muscle gain">Muscle gain</option>
        <option value="general wellness">General wellness</option>
        <option value="flexibility">Flexibility</option>
        <option value="endurance">Endurance</option>
      </select>

      <label for="intensity">Workout Intensity</label>
      <select id="intensity" name="intensity" required>
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Generate Plan</button>
    </form>

    <a class="admin-link" href="/admin/login">Admin login →</a>
  </div>
</body>
</html>
